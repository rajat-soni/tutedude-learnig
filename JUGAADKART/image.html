 <style>
    .image-box{
    width:300px;
    height:300px;
    border:2px solid black;
    overflow:hidden;
    }

 .image-box .imge{
    width:100%;
    height:100%;

    object-position:center;
    object-repeat:no-repeat;
     display:block;
    
}
 </style>
<body>
    <div class="image-box">
    <img src="https://images.pexels.com/photos/35383074/pexels-photo-35383074.jpeg"
    alt="White shoes" class="imge">

</div>
</body>
